<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>TypeHanuman - Free Typing Speed Test & Multiplayer Race</title>
    <meta name="description" content="Test your typing speed with TypeHanuman! Free online typing test, multiplayer typing race, custom paragraphs, multiple themes. Improve your WPM today. Jai Shree Ram!" />
    <meta name="keywords" content="typing test, typing speed, WPM test, multiplayer typing, typing race, free typing test, India typing test" />

    <!-- Google Fonts (Don't remove, keeps font style clean) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Config -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TypeHanuman" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- Open Graph (WhatsApp / Facebook Previews) -->
    <meta property="og:title" content="TypeHanuman - Typing Speed Test" />
    <meta property="og:description" content="Free typing speed test with multiplayer race! Improve your WPM. Jai Shree Ram!" />
    <meta property="og:image" content="https://typehanuman.com/logo.jpg" />
    <meta property="og:url" content="https://typehanuman.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TypeHanuman - Typing Speed Test" />
    <meta name="twitter:description" content="Free typing test with multiplayer race!" />
    <meta name="twitter:image" content="https://typehanuman.com/logo.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker (For PWA/Offline support) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('TypeHanuman SW registered'))
            .catch((err) => console.log('SW registration failed: ', err));
        });
      }
    </script>
  </body>
</html>
